phase-5:
  name: "Convention Discovery"
  goal: "Автоматическое обнаружение и генерация кастомных конвенций проекта"
  exit_metric: "Convention discovery проходит end-to-end: scan → generate → validate → use в test workflow"
  items:

    - id: P5-022
      title: "Создать skill convention-discovery (skills/convention-discovery/SKILL.md)"
      priority: P1
      status: pending
      phase: phase-5
      file: skills/convention-discovery/SKILL.md
      action: >
        Создать skill для автоматического обнаружения конвенций проекта.
        Агент сканирует:
        - Existing test files (структура, naming, patterns)
        - Config files (jest.config, vitest.config, pom.xml, build.gradle, pyproject.toml)
        - Team docs (CONTRIBUTING.md, CODE_STYLE.md, wiki)
        - Source code patterns (error handling, naming, file organization)
        - Forbidden patterns (anti-patterns detected in code)
        Агент должен извлечь правила и создать convention-overlay.md
      acceptance:
        - "skills/convention-discovery/SKILL.md существует с валидным front-matter"
        - "Описывает пошаговый алгоритм обнаружения конвенций"
        - "Содержит категории анализа: existing tests, config files, team docs, code patterns"
        - "Определяет when to stop discovery и generate overlay"
      depends_on: []
      estimated_effort: M
      tags: [skills, convention-discovery, phase-5]

    - id: P5-023
      title: "Convention overlay output format (schema)"
      priority: P1
      status: pending
      phase: phase-5
      file: skills/convention-discovery/convention-overlay-schema.json
      action: >
        Создать JSON Schema для convention-overlay output format.
        Схема должна включать:
        - metadata: project_type, stack, discovered_at
        - conventions: {naming, file_organization, testing_patterns, error_handling, mocking_approach}
        - forbidden_patterns: [{pattern, reason, alternative}]
        - team_notes: [{note, context, source_file}]
        - validation_rules: {must_follow, should_follow, can_ignore}
      acceptance:
        - "Схема существует и валидируется по JSON Schema draft-07"
        - "Поля соответствуют структуре convention overlay"
        - "Пример валидного overlay проходит валидацию"
      depends_on: [P5-022]
      estimated_effort: S
      tags: [schema, phase-5]

    - id: P5-024
      title: "Convention Discovery Agent (agents/convention-discoverer.md)"
      priority: P1
      status: pending
      phase: phase-5
      file: agents/convention-discoverer.md
      action: >
        Создать агента convention-discoverer который выполняет skill convention-discovery.
        Агент должен:
        - Сканировать проект по категориям (tests, configs, docs, source code)
        - Идентифицировать общие паттерны и конвенции
        - Формировать convention-overlay.md по схеме
        - Запускать self-review на валидность
        - Output: .gigacode/conventions/convention-overlay.md
      acceptance:
        - "agents/convention-discoverer.md существует с валидным front-matter"
        - "Содержит failure modes и recovery strategies"
        - "Использует @./skills/convention-discovery/SKILL.md"
        - "Описывает output format и путь сохранения"
      depends_on: [P5-022, P5-023]
      estimated_effort: M
      tags: [agents, phase-5]

    - id: P5-025
      title: "Integration: Loading discovered conventions in test workflow"
      priority: P2
      status: pending
      phase: phase-5
      file: skills/agent-workflow-core/SKILL.md
      action: >
        Расширить agent-workflow-core/SKILL.md алгоритмом загрузки кастомных конвенций.
        При старте тестовой сессии агент:
        1. Проверяет наличие .gigacode/conventions/convention-overlay.md
        2. Если найден — загружает как приоритетный overlay поверх base context/testing-standards.md
        3. Если не найден — использует base overlays из context/
        4. Логирует: [AGENT] loaded conventions from <path>
      acceptance:
        - "Алгоритм загрузки описан в W-разделе SKILL.md"
        - "Приоритет: custom conventions > stack overlay > testing-standards"
        - "Логирование присутствует"
        - "Fallback на base conventions работает"
      depends_on: [P5-022, P5-024]
      estimated_effort: S
      tags: [workflow, integration, phase-5]

    - id: P5-026
      title: "Convention validation and review flow"
      priority: P2
      status: pending
      phase: phase-5
      file: skills/convention-review/SKILL.md
      action: >
        Создать skill для review и валидации discovered conventions.
        Разработчик может:
        - Запустить /review-conventions для проверки сгенерированного overlay
